name: Sandbox repro evidence

# Runs only the mongodProcess-stale-after-crash regression test in isolation, with debug
# logging enabled, so its output can be linked as evidence. Not part of the real CI gate.

on:
  workflow_dispatch:
  push:
    branches:
      - 'test/mongodprocess-stale-after-crash'

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install node_modules
        run: npm ci
      - name: Run mongodProcess-stale-after-crash.test.ts with debug logging
        run: npx --workspace=mongodb-memory-server-core jest mongodProcess-stale-after-crash --verbose --no-coverage --colors
        env:
          DEBUG: 'MongoMS:*'
          CI: true
